apiVersion: awareness.globular.io/v1
kind: AwarenessContract
service: claude
package: claude
package_kind: command
summary: >
  Claude CLI binary. A standalone command-line tool invoked by operators or AI
  services. Has no systemd unit, owns no etcd keys, and manages no cluster state.
  Must be executed only within the node-agent supervisor boundary. Wrapper package:
  the ~250MB proprietary binary is NOT shipped in the payload — the payload carries
  only the shared `noop` sentinel for the verifier. The real binary is fetched at
  install time (scripts/install-claude.sh) from Anthropic's release CDN and verified
  against BOTH the per-version manifest checksum and a pinned sha256 before being
  installed to /usr/local/bin/claude. Because that path is outside /usr/lib/globular/bin,
  the node-agent binary-hash verifier skips it (registry skip_runtime_check: true).

owns:
  etcd_keys: []
  systemd_units: []
  filesystem_paths:
    - /usr/local/bin/claude
  event_types: []

reads:
  etcd_keys: []

writes:
  etcd_keys: []

depends_on: []

emits: []

subscribes: []

invariants:
  - command.checksum_must_match_installed
  - command.execution_within_supervisor_only

forbidden_fixes:
  - execute_outside_node_agent_supervisor
  - store_tokens_in_source_code

known_failure_modes:
  - id: binary_checksum_mismatch
    description: >
      If a freshly downloaded binary does not match the pinned/manifest checksum,
      the install fails closed and never overwrites a working binary.
    diagnosis: "sha256sum /usr/local/bin/claude; compare against scripts/install-claude.sh CLAUDE_EXPECTED_SHA256 and the per-version manifest."
    remedy: "Reinstall via node-agent package install workflow (re-runs install-claude.sh)."
  - id: self_referential_stub_clobber
    description: >
      Historical bug: the package shipped a 58-byte stub payload (exec
      /usr/lib/globular/bin/claude) installed AS /usr/lib/globular/bin/claude, plus
      a wrapper that overwrote /usr/local/bin/claude to exec that stub — an
      exec-loop that destroyed any real binary on every reconcile. Fixed by the
      wrapper/fetch model: the spec must NEVER install a stub to the entrypoint
      path, and must never overwrite /usr/local/bin/claude with a wrapper.
    diagnosis: "ls -l /usr/local/bin/claude (a ~60-byte file is the broken stub, not the real ~250MB binary)."
    remedy: "Re-run install-claude.sh; it fetches and verifies the real binary."

safe_degraded_modes:
  - "If claude binary is unavailable, the cluster continues operating; only AI operator tooling is impacted."

remediation_workflows:
  - node-package-repair

required_tests:
  - TestChecksumValidationOnInstall

required_permissions: []

admission:
  strict: false
  allow_unknown_dependencies: true
  allow_privileged_state_writes: false
