version: 1

metadata:
  name: codex
  version: "0.142.3"
  kind: command
  description: "OpenAI Codex CLI — used by ai-executor to route prompts to Codex with ChatGPT-token or API-key auth."
  keywords: [codex, openai, ai, cli, llm]
  license: Apache-2.0
  # Wrapper package: the real Codex vendor tree is NOT in the payload. The
  # payload carries only the shared `noop` sentinel (for the node-agent verifier);
  # the real CLI and adjacent resources are fetched + verified at install time by
  # scripts/install-codex.sh and live under /usr/local/lib/codex with
  # /usr/local/bin/codex as a symlink entrypoint.
  entrypoint: noop
  install_bins: false

steps:
  - id: ensure-user-group
    type: ensure_user_group
    user: globular
    group: globular
    home: "{{.StateDir}}"
    shell: /usr/sbin/nologin
    system: true

  - id: ensure-dirs
    type: ensure_dirs
    dirs:
      - path: "{{.Prefix}}"
        owner: root
        group: root
        mode: 0755
      - path: "{{.Prefix}}/bin"
        owner: root
        group: root
        mode: 0755
      - path: "/usr/local/bin"
        owner: root
        group: root
        mode: 0755
      - path: "/usr/local/lib/codex"
        owner: root
        group: root
        mode: 0755

  - id: install-payload
    type: install_package_payload
    install_bins: true
    install_config: false
    install_spec: false
    install_systemd: false

  - id: fetch-codex
    type: run_script
    script: install-codex.sh
    timeout: 5m
    required: true
