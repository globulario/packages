version: 1

metadata:
  name: oxigraph
  version: "0.5.9"
  kind: infrastructure
  description: "Oxigraph RDF store backend for awareness-graph query and graph-store load paths."
  keywords: [oxigraph, rdf, sparql, triplestore, awareness]
  license: MIT
  entrypoint: oxigraph

steps:
  - id: ensure-user-group
    type: ensure_user_group
    user: globular
    group: globular
    home: "{{.StateDir}}"
    shell: /usr/sbin/nologin
    system: true

  - id: ensure-dirs
    type: ensure_dirs
    dirs:
      - path: "{{.Prefix}}"
        owner: root
        group: root
        mode: 0755
      - path: "{{.Prefix}}/bin"
        owner: root
        group: root
        mode: 0755

      - path: "{{.StateDir}}"
        owner: globular
        group: globular
        mode: 0750
      - path: "{{.StateDir}}/oxigraph"
        owner: globular
        group: globular
        mode: 0750

  - id: install-oxigraph-payload
    type: install_package_payload
    install_bins: true
    install_config: false
    install_spec: false
    install_systemd: false

  - id: install-oxigraph-service
    type: install_services
    units:
      - name: globular-oxigraph.service
        owner: root
        group: root
        mode: 0644
        atomic: true
        content: |
          [Unit]
          Description=Globular Oxigraph RDF Store
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=globular
          Group=globular
          Environment=OXIGRAPH_BIND=0.0.0.0:7878
          Environment=OXIGRAPH_DATA_DIR={{.StateDir}}/oxigraph
          PermissionsStartOnly=true
          ExecStartPre=/bin/sh -c 'test -x {{.Prefix}}/bin/oxigraph'
          ExecStartPre=/bin/sh -c 'mkdir -p ${OXIGRAPH_DATA_DIR} && chown -R globular:globular ${OXIGRAPH_DATA_DIR}'
          ExecStart={{.Prefix}}/bin/oxigraph serve --bind ${OXIGRAPH_BIND} --location ${OXIGRAPH_DATA_DIR}
          Restart=on-failure
          RestartSec=2
          LimitNOFILE=262144
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target

  - id: enable-oxigraph
    type: enable_services
    services:
      - globular-oxigraph.service

  - id: start-oxigraph
    type: start_services
    services:
      - globular-oxigraph.service
    binaries:
      globular-oxigraph.service: oxigraph

  - id: health-oxigraph
    type: health_checks
    services:
      - globular-oxigraph.service
