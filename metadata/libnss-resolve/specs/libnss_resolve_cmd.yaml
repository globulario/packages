version: 1

metadata:
  name: libnss-resolve
  version: "255.4"
  kind: command
  description: "systemd-resolved NSS bridge for reliable *.globular.internal hostname resolution."
  keywords: [dns, nss, systemd-resolved, resolver]
  license: LGPL-2.1
  # Bundle the OS libnss-resolve .deb at build time so install stays
  # offline/deterministic under node-agent and globular-installer — no live
  # apt-get at join time.
  bundle_debs:
    - libnss-resolve
  entrypoint: bin/libnss-resolve
  install_bins: false

# Wrapper/marker package: libnss-resolve has no executable of its own — it is
# a passive NSS plugin library (/lib/.../libnss_resolve.so.2), never invoked
# directly. The {{.Prefix}}/bin/libnss-resolve file installed below exists
# solely as a stable, checksummed install-receipt anchor so node-agent's
# convergence checks (entrypoint checksum proof) have something to verify,
# mirroring how the sctool package wraps scylla-manager-client.
entrypoint: bin/libnss-resolve
install_bins: false

steps:
  - id: ensure-dirs
    type: ensure_dirs
    dirs:
      - path: "{{.Prefix}}"
        owner: root
        group: root
        mode: 0755
      - path: "{{.Prefix}}/bin"
        owner: root
        group: root
        mode: 0755

  # This package carries a bundled .deb file, not a bin/libnss-resolve payload.
  - id: install-payload
    type: install_package_payload
    install_bins: false
    install_config: false
    install_spec: false
    install_systemd: false

  # Install libnss-resolve and its bundled dependencies offline.
  - id: install-libnss-resolve-debs
    type: install_local_debs

  # Wire the "resolve" NSS method into nsswitch.conf so glibc- and
  # cgo-resolver-based hostname lookups (including Go binaries) route
  # through systemd-resolved, which is what actually knows how to answer
  # *.globular.internal after the join script's DNS resolver configuration.
  # Only touches the mdns4_minimal-style default some base images ship;
  # leaves an already-configured hosts: line alone.
  - id: configure-nsswitch
    type: run_script
    script: configure-nsswitch.sh

  # Install-receipt/verifier anchor — not meant to be invoked.
  - id: install-libnss-resolve-marker
    type: install_files
    files:
      - path: "{{.Prefix}}/bin/libnss-resolve"
        owner: root
        group: root
        mode: 0755
        atomic: true
        content: |
          #!/bin/sh
          # Install-receipt marker for the libnss-resolve package — not meant
          # to be invoked directly. The actual NSS plugin lives at
          # /lib/x86_64-linux-gnu/libnss_resolve.so.2 (installed via dpkg).
          echo "libnss-resolve: systemd-resolved NSS bridge (see /etc/nsswitch.conf)"
