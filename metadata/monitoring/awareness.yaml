apiVersion: awareness.globular.io/v1
kind: AwarenessContract
service: monitoring
package: monitoring
package_kind: service
summary: >
  Monitoring service: thin RBAC-aware wrapper over the Prometheus HTTP API
  (Query, QueryRange, Alerts, LabelNames, ...). Exposes the same surface as
  authenticated, authorized gRPC RPCs for operator dashboards. Stateless —
  no own storage; every query proxies to a Prometheus endpoint resolved
  from /globular/services/monitoring/config in etcd.

owns:
  etcd_keys:
    - /globular/services/monitoring/config
    - /globular/services/monitoring/instances/{node}
  systemd_units:
    - globular-monitoring.service
  filesystem_paths: []
  event_types:
    - monitoring.alert.fired
    - monitoring.alert.resolved

reads:
  etcd_keys:
    - /globular/system/config
    - /globular/services/monitoring/config

writes:
  etcd_keys:
    - /globular/services/monitoring/instances/{node}

depends_on:
  - service: etcd
    phase: bootstrap
    required: true
    reason: Reads service config and publishes instance record to etcd.

  - service: prometheus
    phase: day1
    required: true
    reason: >
      Sole metrics backend. Every monitoring RPC proxies to this Prometheus
      endpoint. If Prometheus is unreachable from the node hosting the
      monitoring service, every query returns 5xx. Verified against
      golang/monitoring/monitoring_store/prometheus.go (the only store
      implementation).

  - service: authentication
    phase: day1
    required: true
    reason: Authenticates all monitoring API requests.

  - service: rbac
    phase: day1
    required: true
    reason: Enforces access control for metrics queries and alert management.

emits:
  - monitoring.alert.fired
  - monitoring.alert.resolved

subscribes: []

invariants:
  - monitoring.all_rpcs_have_authz_annotation

forbidden_fixes:
  - bypass_rbac_for_monitoring_queries

known_failure_modes:
  - id: prometheus_unavailable
    description: >
      If Prometheus is unreachable from the monitoring service's node, ALL
      queries fail (no fallback store exists). Service unit may stay active
      but every RPC returns 5xx and any health check that performs a real
      query goes red.
    diagnosis: >
      Check globular-prometheus.service on the local node and the
      Prometheus address in /globular/services/monitoring/config. Curl the
      Prometheus /-/healthy endpoint from the monitoring node.
    remedy: >
      Restore Prometheus on the affected node, or fix the configured
      Prometheus address in etcd. Monitoring reconnects automatically.

safe_degraded_modes:
  - "If monitoring service is down, the cluster continues operating; dashboards are unavailable."

remediation_workflows: []

required_tests:
  - TestMonitoringAuthzAnnotations

required_permissions:
  - etcd:read:/globular/system/config
  - etcd:write:/globular/services/monitoring/instances/

admission:
  strict: false
  allow_unknown_dependencies: false
  allow_privileged_state_writes: false
