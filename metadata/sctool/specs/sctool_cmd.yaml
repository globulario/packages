version: 1

metadata:
  name: sctool
  version: "3.11.1"
  kind: command
  description: "Scylla Manager CLI client for scheduling repairs, backups, and managing ScyllaDB clusters."
  keywords: [sctool, scylla-manager, cli, repair, backup, scylladb]
  license: Proprietary
  # Bundle the Scylla Manager client .deb at build time so install stays
  # offline/deterministic under node-agent and globular-installer.
  bundle_debs:
    - scylla-manager-client
  entrypoint: bin/sctool
  install_bins: false

# Wrapper package: the real sctool binary comes from the bundled
# scylla-manager-client .deb. We install that .deb offline at node install time
# and expose a stable launcher under both {{.Prefix}}/bin/sctool (the
# verifier/install-receipt authority path) and /usr/local/bin/sctool (operator
# PATH convenience).
entrypoint: bin/sctool
install_bins: false

steps:
  - id: ensure-user-group
    type: ensure_user_group
    user: globular
    group: globular
    home: "{{.StateDir}}"
    shell: /usr/sbin/nologin
    system: true

  - id: ensure-dirs
    type: ensure_dirs
    dirs:
      - path: "{{.Prefix}}"
        owner: root
        group: root
        mode: 0755
      - path: "{{.Prefix}}/bin"
        owner: root
        group: root
        mode: 0755
      - path: "/usr/local/bin"
        owner: root
        group: root
        mode: 0755

  # This package carries bundled .deb files, not a bin/sctool payload.
  - id: install-payload
    type: install_package_payload
    install_bins: false
    install_config: false
    install_spec: false
    install_systemd: false

  # Install scylla-manager-client and its bundled dependencies offline.
  - id: install-sctool-debs
    type: install_local_debs

  # Provide a stable verifier/receipt path plus an operator-facing PATH alias.
  - id: install-sctool-wrapper
    type: install_files
    files:
      - path: "{{.Prefix}}/bin/sctool"
        owner: root
        group: root
        mode: 0755
        atomic: true
        content: |
          #!/bin/sh
          set -e
          for candidate in \
            /usr/bin/sctool \
            /opt/scylladb/scylla-manager/sctool \
            /opt/scylladb/scylla-manager/bin/sctool \
            /usr/lib/scylla-manager/sctool \
            /usr/libexec/scylla-manager/sctool
          do
            if [ -x "$candidate" ]; then
              exec "$candidate" "$@"
            fi
          done
          echo "sctool wrapper: real sctool binary not found after installing scylla-manager-client" >&2
          exit 127
      - path: "/usr/local/bin/sctool"
        owner: root
        group: root
        mode: 0755
        atomic: true
        content: |
          #!/bin/sh
          set -e
          exec "{{.Prefix}}/bin/sctool" "$@"
