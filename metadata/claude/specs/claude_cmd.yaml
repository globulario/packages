version: 1

metadata:
  name: claude
  version: "2.1.177"
  kind: command
  description: "Anthropic Claude CLI — used by ai-executor to route prompts to a Claude Max / OAuth subscription."
  keywords: [claude, anthropic, ai, cli, llm]
  license: Proprietary
  # Wrapper package: the real ~250MB proprietary CLI is NOT in the payload. The
  # the real binary is fetched + verified at install time by scripts/install-claude.sh
  # and lives at /usr/local/bin/claude (outside /usr/lib/globular/bin, so the
  # binary-hash verifier skips it — see registry.yaml skip_runtime_check: true).
  entrypoint: none
  install_bins: false
  # Declared, verifiable identity (identity.has_single_canonical_source_and_is_immutable).
  # The fetched binary at installed_path MUST hash to this pinned sha256. pkg build
  # carries it into the manifest verbatim (the build never sees the binary); the
  # node-agent re-hashes /usr/local/bin/claude and compares — a declared canonical
  # value, never one recomputed from disk. Keep this in lockstep with
  # scripts/install-claude.sh CLAUDE_EXPECTED_SHA256 and package.json identity.
  identity:
    proof: binary_sha256
    installed_path: /usr/local/bin/claude
    checksum: "sha256:ff41753634b20c869ef6a32a20863521b33d4186ac0d6a49379ab48a48395ee7"

steps:
  - id: ensure-user-group
    type: ensure_user_group
    user: globular
    group: globular
    home: "{{.StateDir}}"
    shell: /usr/sbin/nologin
    system: true

  - id: ensure-dirs
    type: ensure_dirs
    dirs:
      - path: "{{.Prefix}}"
        owner: root
        group: root
        mode: 0755
      - path: "{{.Prefix}}/bin"
        owner: root
        group: root
        mode: 0755
      - path: "/usr/local/bin"
        owner: root
        group: root
        mode: 0755

  # node-agent verifier has its expected hashable artifact. Same pattern that
  # keepalived and scylladb use for externally-provisioned software.
  - id: install-payload
    type: install_package_payload
    install_bins: false
    install_config: false
    install_spec: false
    install_systemd: false

  # Fetch the real Claude CLI from Anthropic's release CDN, verify it against the
  # per-version manifest checksum AND the pinned sha256, and install it to
  # /usr/local/bin/claude. Idempotent and fail-soft: if the pinned version is
  # already present and working it is a no-op; a transient network failure with a
  # working binary already installed does not break the install.
  - id: fetch-claude
    type: run_script
    script: install-claude.sh
    timeout: 5m
