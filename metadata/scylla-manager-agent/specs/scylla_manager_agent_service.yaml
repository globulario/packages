version: 1

metadata:
  name: scylla_manager_agent
  version: "3.11.1"
  kind: infrastructure
  description: "ScyllaDB Manager agent that runs on each node to execute repair and backup operations."
  keywords: [scylla-manager-agent, scylladb, agent, repair, backup]
  license: Proprietary
  bundle_debs:
    - scylla-manager-agent
  # Wrapper package: the real binary comes from the bundled .deb, but Globular
  # owns a stable launcher under {{.Prefix}}/bin/scylla_manager_agent.
  entrypoint: bin/scylla_manager_agent
  install_bins: false

steps:
  - id: ensure-user-group
    type: ensure_user_group
    user: globular
    group: globular
    home: "{{.StateDir}}"
    shell: /usr/sbin/nologin
    system: true

  - id: ensure-dirs
    type: ensure_dirs
    dirs:
      - path: "{{.Prefix}}"
        owner: root
        group: root
        mode: 0755
      - path: "{{.Prefix}}/bin"
        owner: root
        group: root
        mode: 0755

      - path: "{{.StateDir}}"
        owner: globular
        group: globular
        mode: 0750
      - path: "{{.StateDir}}/scylla-manager-agent"
        owner: scylla
        group: globular
        mode: 0750

  - id: install-payload
    type: install_package_payload
    install_bins: false
    install_config: false
    install_spec: false
    install_systemd: false

  - id: prevent-scylla-manager-agent-autostart
    type: run_script
    script: prevent-autostart.sh

  - id: install-scylla-manager-agent-debs
    type: install_local_debs

  - id: allow-scylla-manager-agent-autostart
    type: run_script
    script: allow-autostart.sh

  - id: install-scylla-manager-agent-wrapper
    type: install_files
    files:
      - path: "{{.Prefix}}/bin/scylla_manager_agent"
        owner: root
        group: root
        mode: 0755
        atomic: true
        content: |
          #!/bin/sh
          set -e
          for candidate in \
            /usr/bin/scylla-manager-agent \
            /opt/scylladb/scylla-manager/scylla-manager-agent \
            /opt/scylladb/scylla-manager/bin/scylla-manager-agent \
            /usr/lib/scylla-manager/scylla-manager-agent \
            /usr/libexec/scylla-manager/scylla-manager-agent
          do
            if [ -x "$candidate" ]; then
              exec "$candidate" "$@"
            fi
          done
          echo "scylla_manager_agent wrapper: real scylla-manager-agent binary not found after installing scylla-manager-agent" >&2
          exit 127

  - id: install-scylla-manager-agent-config
    type: install_files
    files:
      - path: "{{.StateDir}}/scylla-manager-agent/scylla-manager-agent.yaml"
        owner: scylla
        group: globular
        mode: 0640
        atomic: true
        skip_if_exists: true
        content: |
          # Scylla Manager Agent configuration (managed by Globular)
          #
          # auth_token, https/prometheus/debug ports, and the scylla: block are
          # owned by the node-agent reconciler — see
          # services/golang/node_agent/node_agent_server/scylla_manager_agent_config.go.
          # The token is derived from sha256(domain|ca_hash) so every agent in
          # the cluster shares the same value (sctool cluster add talks to
          # every host with a single token).
          #
          # install-day0.sh appends the s3: + rclone: blocks (MinIO creds for
          # ScyllaDB backups). Nothing here should write auth_token: — a
          # per-node UUID written here would win the race against the
          # reconciler and break manager → agent auth on non-coordinator hosts.

  - id: install-scylla-manager-agent-service
    type: install_services
    units:
      - name: globular-scylla-manager-agent.service
        owner: root
        group: root
        mode: 0644
        atomic: true
        content: |
          [Unit]
          Description=Globular Scylla Manager Agent
          After=network-online.target scylla-server.service
          Wants=network-online.target scylla-server.service

          [Service]
          Type=simple
          User=scylla
          Group=scylla
          SupplementaryGroups=globular
          ExecStart={{.Prefix}}/bin/scylla_manager_agent --config-file {{.StateDir}}/scylla-manager-agent/scylla-manager-agent.yaml
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=100000

          [Install]
          WantedBy=multi-user.target

  - id: enable-scylla-manager-agent
    type: enable_services
    services:
      - globular-scylla-manager-agent.service

  - id: start-scylla-manager-agent
    type: start_services
    services:
      - globular-scylla-manager-agent.service
    binaries:
      globular-scylla-manager-agent.service: scylla_manager_agent

  - id: health-scylla-manager-agent
    type: health_checks
    services:
      - globular-scylla-manager-agent.service
