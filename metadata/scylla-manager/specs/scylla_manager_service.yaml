version: 1

metadata:
  name: scylla_manager
  version: "3.11.1"
  kind: infrastructure
  description: "ScyllaDB Manager server for automated repair, backup, and cluster management."
  keywords: [scylla-manager, scylladb, repair, backup, cluster-management]
  license: Proprietary
  entrypoint: scylla_manager

steps:
  - id: ensure-user-group
    type: ensure_user_group
    user: globular
    group: globular
    home: "{{.StateDir}}"
    shell: /usr/sbin/nologin
    system: true

  - id: ensure-dirs
    type: ensure_dirs
    dirs:
      - path: "{{.Prefix}}"
        owner: root
        group: root
        mode: 0755
      - path: "{{.Prefix}}/bin"
        owner: root
        group: root
        mode: 0755

      - path: "{{.StateDir}}"
        owner: globular
        group: globular
        mode: 0750
      - path: "{{.StateDir}}/scylla-manager"
        owner: globular
        group: globular
        mode: 0750

  - id: install-scylla-manager-binary
    type: install_package_payload
    install_bins: true
    install_config: false
    install_spec: false
    install_systemd: false

  - id: install-scylla-manager-config-script
    type: install_files
    files:
      - path: "{{.Prefix}}/bin/scylla-manager-configure"
        owner: root
        group: root
        mode: 0755
        atomic: true
        content: |
          #!/bin/sh
          # Generate or patch scylla-manager config with the correct CQL host and HTTPS.
          # Reads ScyllaDB's listen address from its config; falls back
          # to detecting the address from the listening socket.
          CFG="{{.StateDir}}/scylla-manager/scylla-manager.yaml"
          CERT="{{.StateDir}}/pki/issued/services/service.crt"
          KEY="{{.StateDir}}/pki/issued/services/service.key"

          if [ -f "$CFG" ]; then
            # Config exists — patch in HTTPS block if missing
            if ! grep -q "^https:" "$CFG"; then
              HTTP_HOST=$(grep -E '^http:' "$CFG" | awk '{print $2}' | cut -d: -f1 | tr -d ' ')
              if [ -n "$HTTP_HOST" ] && [ -f "$CERT" ] && [ -f "$KEY" ]; then
                sed -i \
                  -e "/^http:/a https: ${HTTP_HOST}:5443" \
                  -e "/^https:/a tls_cert_file: $CERT" \
                  -e "/^tls_cert_file:/a tls_key_file: $KEY" \
                  "$CFG"
              fi
            fi
            exit 0
          fi

          # 1) Try ScyllaDB's own config
          SCYLLA_CFG="/etc/scylla/scylla.yaml"
          CQL_HOST=""
          if [ -f "$SCYLLA_CFG" ]; then
            CQL_HOST=$(grep -E '^rpc_address:' "$SCYLLA_CFG" | awk '{print $2}' | tr -d "[:space:]'\"")
            [ -z "$CQL_HOST" ] && CQL_HOST=$(grep -E '^listen_address:' "$SCYLLA_CFG" | awk '{print $2}' | tr -d "[:space:]'\"")
          fi
          # 2) Fallback: parse the listening socket
          if [ -z "$CQL_HOST" ] || [ "$CQL_HOST" = "0.0.0.0" ]; then
            CQL_HOST=$(ss -lnt | awk '/:9042 /{split($4,a,":"); print a[1]; exit}')
          fi
          # 3) Error out — never fall back to localhost (CLAUDE.md hard rule)
          if [ -z "$CQL_HOST" ] || [ "$CQL_HOST" = "127.0.0.1" ]; then
            echo "scylla-manager-configure: cannot determine ScyllaDB routable IP — aborting" >&2
            exit 1
          fi
          # Build TLS block only when certs exist
          TLS_BLOCK=""
          if [ -f "$CERT" ] && [ -f "$KEY" ]; then
            TLS_BLOCK="https: ${CQL_HOST}:5443
          tls_cert_file: $CERT
          tls_key_file: $KEY
          "
          fi
          cat > "$CFG" <<EOCONF
          # Scylla Manager configuration (managed by Globular)
          http: ${CQL_HOST}:5080
          ${TLS_BLOCK}
          database:
            hosts:
              - ${CQL_HOST}
            port: 9042
          EOCONF
          # Fix indentation (strip leading whitespace from heredoc)
          sed -i 's/^          //' "$CFG"
          chown globular:globular "$CFG"
          chmod 0640 "$CFG"

  - id: install-scylla-manager-register-cluster
    type: install_files
    files:
      - path: "{{.Prefix}}/bin/scylla-manager-register-cluster"
        owner: root
        group: root
        mode: 0755
        atomic: true
        content: |
          #!/bin/sh
          set -eu

          CLUSTER_NAME="${SCYLLA_MANAGER_CLUSTER_NAME:-globular-internal}"
          STATE_DIR="{{.StateDir}}"
          GLOBULAR_CA="${GLOBULAR_CA:-$STATE_DIR/pki/ca.crt}"
          SCYLLA_CFG="${SCYLLA_CFG:-/etc/scylla/scylla.yaml}"
          AGENT_CFG="${SCYLLA_AGENT_CFG:-$STATE_DIR/scylla-manager-agent/scylla-manager-agent.yaml}"
          SM_CFG="${SCYLLA_MANAGER_CFG:-$STATE_DIR/scylla-manager/scylla-manager.yaml}"

          log() {
            echo "scylla-manager-register-cluster: $*" >&2
          }

          host_from_scylla_cfg() {
            if [ -f "$SCYLLA_CFG" ]; then
              awk '/^rpc_address:/{gsub(/["'"'"'[:space:]]/, "", $2); if ($2 != "") { print $2; exit }} /^listen_address:/{gsub(/["'"'"'[:space:]]/, "", $2); if ($2 != "") { print $2; exit }}' "$SCYLLA_CFG"
            fi
          }

          host_from_manager_cfg() {
            if [ -f "$SM_CFG" ]; then
              awk '/^http:/{gsub(/["[:space:]]/, "", $2); split($2, a, ":"); if (a[1] != "") { print a[1]; exit }} /^https:/{gsub(/["[:space:]]/, "", $2); split($2, a, ":"); if (a[1] != "") { print a[1]; exit }}' "$SM_CFG"
            fi
          }

          parse_agent_field() {
            key="$1"
            awk -v key="$key" '
              $1 == key ":" {
                value = $2
                gsub(/["'"'"'[:space:]]/, "", value)
                print value
                exit
              }
            ' "$AGENT_CFG"
          }

          HOST="${SCYLLA_MANAGER_HOST:-}"
          if [ -z "$HOST" ]; then
            HOST="$(host_from_scylla_cfg || true)"
          fi
          if [ -z "$HOST" ]; then
            HOST="$(host_from_manager_cfg || true)"
          fi
          if [ -z "$HOST" ] || [ "$HOST" = "127.0.0.1" ] || [ "$HOST" = "localhost" ]; then
            log "cannot determine Scylla routable host"
            exit 1
          fi

          HTTPS_BASE="${SCYLLA_MANAGER_HTTPS_BASE:-https://$HOST:5443/api/v1}"
          HTTP_BASE="${SCYLLA_MANAGER_HTTP_BASE:-http://$HOST:5080/api/v1}"

          if [ ! -f "$AGENT_CFG" ]; then
            log "agent config missing at $AGENT_CFG"
            exit 1
          fi

          AUTH_TOKEN="$(parse_agent_field auth_token || true)"
          AGENT_HTTPS="$(parse_agent_field https || true)"
          AGENT_PORT="${SCYLLA_MANAGER_AGENT_PORT:-}"
          if [ -z "$AGENT_PORT" ] && [ -n "$AGENT_HTTPS" ]; then
            AGENT_PORT="${AGENT_HTTPS##*:}"
          fi
          if [ -z "$AUTH_TOKEN" ] || [ -z "$AGENT_PORT" ]; then
            log "agent auth token or HTTPS port missing in $AGENT_CFG"
            exit 1
          fi

          READ_BASE=""
          READ_CURL_OPTS=""
          set +e
          if [ -f "$GLOBULAR_CA" ]; then
            curl -fsS --capath /dev/null --cacert "$GLOBULAR_CA" "$HTTPS_BASE/version" >/dev/null 2>&1
            probe_rc=$?
          else
            probe_rc=7
          fi
          set -e

          case "$probe_rc" in
            0)
              READ_BASE="$HTTPS_BASE"
              READ_CURL_OPTS="--capath /dev/null --cacert $GLOBULAR_CA"
              log "HTTPS reachable with valid cert; using $READ_BASE for read probes"
              ;;
            7)
              READ_BASE="$HTTP_BASE"
              READ_CURL_OPTS=""
              log "HTTPS not enabled; falling back to $READ_BASE for read probes"
              ;;
            *)
              log "HTTPS reachable but cert validation failed (curl exit $probe_rc); refusing to fall back to HTTP"
              exit 2
              ;;
          esac

          CLUSTERS_JSON="$(mktemp)"
          trap 'rm -f "$CLUSTERS_JSON"' EXIT INT TERM
          # shellcheck disable=SC2086
          curl -fsS $READ_CURL_OPTS "$READ_BASE/clusters" >"$CLUSTERS_JSON"

          if grep -q "\"name\":\"$CLUSTER_NAME\"" "$CLUSTERS_JSON"; then
            log "cluster '$CLUSTER_NAME' already registered — no-op"
            exit 0
          fi
          if grep -q "\"host\":\"$HOST\"" "$CLUSTERS_JSON"; then
            log "cluster for host '$HOST' already registered under a different name — leaving it untouched"
            exit 0
          fi

          if ! command -v sctool >/dev/null 2>&1; then
            log "sctool not found on PATH"
            exit 1
          fi

          log "registering cluster '$CLUSTER_NAME' via sctool"
          sctool --api-url "$HTTP_BASE" cluster add \
            --name "$CLUSTER_NAME" \
            --host "$HOST" \
            --auth-token "$AUTH_TOKEN" \
            --port "$AGENT_PORT"

  - id: install-scylla-manager-service
    type: install_services
    units:
      - name: globular-scylla-manager.service
        owner: root
        group: root
        mode: 0644
        atomic: true
        content: |
          [Unit]
          Description=Globular Scylla Manager
          After=network-online.target scylla-server.service
          Wants=network-online.target scylla-server.service

          [Service]
          Type=simple
          User=globular
          Group=globular
          ExecStartPre=/bin/sh -c 'for i in $(seq 1 90); do ss -lnt | grep -q ":9042 " && exit 0; sleep 1; done; echo "scylla 9042 not ready"; exit 1'
          ExecStartPre={{.Prefix}}/bin/scylla-manager-configure
          ExecStart={{.Prefix}}/bin/scylla_manager --config-file {{.StateDir}}/scylla-manager/scylla-manager.yaml
          ExecStartPost=-+{{.Prefix}}/bin/scylla-manager-register-cluster
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=100000

          [Install]
          WantedBy=multi-user.target

  - id: enable-scylla-manager
    type: enable_services
    services:
      - globular-scylla-manager.service

  - id: start-scylla-manager
    type: start_services
    services:
      - globular-scylla-manager.service
    binaries:
      globular-scylla-manager.service: scylla_manager

  - id: health-scylla-manager
    type: health_checks
    services:
      - globular-scylla-manager.service
